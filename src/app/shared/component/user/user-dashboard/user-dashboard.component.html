<div class="container">
    <div class="row d-flex justify-content-end">
        <button
            routerLink="/user/add"
            class="btn btn-sm btn-outline-primary ">
            Add User
        </button>
    </div>
    <div class="row mt-4">
        <div class="col-md-4">
            <ul class="list-group">
                <li
                    [routerLink]="[user.id]"
                    routerLinkActive="active"
                    *ngFor="let user of users"
                    class="list-group-item">
                    {{user.name}}
                    <small>({{user.userRole}} / {{ user.role}})</small>
                </li>
            </ul>
        </div>
        <div class="col-md-8">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
